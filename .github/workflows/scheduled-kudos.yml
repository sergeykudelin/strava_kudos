name: Run Strava Kudos Bot

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  schedule:
    # Note: GitHub Actions uses UTC. Calgary is in Mountain Time (MDT/MST).
    # MDT is UTC-6, MST is UTC-7. These cron times are set based on MDT.
    # The actual run time may shift by an hour depending on daylight saving time.
    - cron: '0 14 * * *' # Approximately 8:00 AM in Calgary (MDT)
    - cron: '0 0 * * *'  # Approximately 6:00 PM in Calgary (MDT)

jobs:
  run-kudos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create config.yaml from secret
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: echo "$CONFIG_YAML" > config.yaml

      - name: Install dependencies
        run: npm install

      - name: Run the kudos script
        run: npm start