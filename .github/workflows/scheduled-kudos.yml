name: Run Strava Kudos Bot

on:
  workflow_dispatch:
  schedule:
    # Calgary is UTC-7 (Standard Time). 
    # 8:00 AM Calgary = 15:00 UTC
    # 6:00 PM Calgary = 01:00 UTC
    - cron: '0 1,15 * * *'

jobs:
  run-kudos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create config.yaml from secret
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: echo "$CONFIG_YAML" > config.yaml

      - name: Install dependencies
        run: npm install

      - name: Run the kudos script
        run: npm start